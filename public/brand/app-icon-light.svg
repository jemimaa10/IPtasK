    <circle cx="99" cy="71" r="3.2" fill="#10140a"/>
    <circle cx="139" cy="71" r="3.2" fill="#10140a"/>
    <ellipse cx="80" cy="96" rx="7" ry="4" fill="#ff6bd6" opacity=".75"/>
    <ellipse cx="152" cy="96" rx="7" ry="4" fill="#ff6bd6" opacity=".75"/>
    <path d="M104 96 Q116 108 128 96" fill="none" stroke="#c6f432" stroke-width="6" stroke-linecap="round"/>
