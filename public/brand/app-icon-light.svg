<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="IPtasK"><title>IPtasK</title><rect width="512" height="512" rx="112" fill="#ffffff"/><g transform="translate(44 66) scale(1.8)">
